services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: rag-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        echo "Waiting for Ollama...";
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        echo "Pulling models...";
        ollama pull "$${OLLAMA_MODEL}";
        ollama pull "$${OLLAMA_EMBED_MODEL}";
        echo "Ollama model pull complete.";
    restart: "no"

  rag-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-webapp
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      RAG_ADMIN_USERNAME: ${RAG_ADMIN_USERNAME:-admin}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:-admin}
      RAG_ADMIN_TOKEN: ${RAG_ADMIN_TOKEN:-mvp-admin-token}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-qwen:7b}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./webapp_data:/app/webapp_data
    restart: unless-stopped

volumes:
  ollama_data:
